<!-- Elder-login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Elder Login – CareConnect</title>
  <link rel="stylesheet" href="/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>CareConnect – Elder Help Platform</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/elder-login">Elder Login</a>
    </nav>
  </header>

  <main class="container mt-4">
    <form id="elderLoginForm" class="mx-auto" style="max-width: 600px;">
      <h3 class="mb-3">Elder Login</h3>
      <input name="email" type="email" placeholder="Email" class="form-control mb-2" required />
      <input name="password" type="password" placeholder="Password" class="form-control mb-3" required />
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <div id="loginStatus" class="text-center mt-3 text-danger"></div>
  </main>

  <footer class="text-center mt-5">
    <p>&copy; 2025 CareConnect</p>
  </footer>

  <script>
  document.getElementById("elderLoginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const email = form.email.value;
    const password = form.password.value;

    const response = await fetch("/api/elders/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });

    const result = await response.json();
    const statusBox = document.getElementById("loginStatus");

    if (response.ok && result.elder && result.elder._id) {
      // ✅ Save elder details in localStorage
      localStorage.setItem("elderId", result.elder._id);
      localStorage.setItem("elderName", result.elder.name);

      statusBox.classList.remove("text-danger");
      statusBox.classList.add("text-success");
      statusBox.textContent = result.msg;

      // ✅ Redirect to dashboard
      setTimeout(() => {
        window.location.href = "/elder-dashboard";
      }, 1000);
    } else {
      statusBox.classList.add("text-danger");
      statusBox.textContent = result.msg || "Login failed";
    }
  });
</script>

</body>
</html>
