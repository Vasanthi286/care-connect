<!-- Elder Registeration -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Elder Register – CareConnect</title>
  <link rel="stylesheet" href="/style.css" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
  <header>
    <h1>CareConnect – Elder Help Platform</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/elder-login">Elder Login</a>
      <a href="/elder-register">Elder Register</a>
    </nav>
  </header>

  <main>
    <!-- ✅ Styled success alert just like Volunteer page -->
    <div id="success-alert" class="alert alert-success alert-dismissible fade show text-center mx-auto" role="alert" style="max-width: 600px; display: none;">
      <strong>✅ Elder registered successfully!</strong>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- ❌ Already Registered Alert -->
<div id="exists-alert" class="alert alert-danger alert-dismissible fade show text-center mx-auto" role="alert" style="max-width: 600px; display: none;">
  <strong>⚠️ This email is already registered!</strong>
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>


    <form action="/api/elders/submit-elder" method="POST" class="mx-auto mt-4" style="max-width: 600px;">
      <h3 class="mb-3">Elder Registration</h3>

      <label for="name">Full Name:</label>
      <input name="name" placeholder="Full Name" class="form-control mb-3" required />

      <label for="age">Age:</label>
      <input name="age" type="number" placeholder="Age" class="form-control mb-3" required />

      <label for="location">Location:</label>
      <input name="location" placeholder="Location" class="form-control mb-3" required />

      <label for="contact">Contact:</label>
      <input name="contact" placeholder="Contact" class="form-control mb-3" required />

      <label for="email">Email:</label>
      <input name="email" type="email" placeholder="Email" class="form-control mb-3" required />

      <label for="password">Password:</label>
      <input name="password" type="password" placeholder="Password" class="form-control mb-4" required />

      <div class="text-center">
        <button type="submit" class="btn btn-success px-4">Register</button>
      </div>
    </form>
  </main>

  <footer class="text-center mt-5">
    <p>&copy; 2025 CareConnect</p>
  </footer>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

 <script>
  const urlParams = new URLSearchParams(window.location.search);
  const submitted = urlParams.get("submitted");
  const exists = urlParams.get("exists");

  if (submitted) {
    const alertBox = document.getElementById("success-alert");
    alertBox.style.display = "block";
    setTimeout(() => {
      const alert = bootstrap.Alert.getOrCreateInstance(alertBox);
      alert.close();
    }, 10000);
  }

  if (exists) {
    const existsAlert = document.getElementById("exists-alert");
    existsAlert.style.display = "block";
    setTimeout(() => {
      const alert = bootstrap.Alert.getOrCreateInstance(existsAlert);
      alert.close();
    }, 10000);
  }

  // Clean the URL
  window.history.replaceState({}, document.title, window.location.pathname);
</script>

</body>
</html>
