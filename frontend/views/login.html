<!-- Volunteer Login-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Volunteer Login – CareConnect</title>
  <link rel="stylesheet" href="/style.css" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
  <header>
    <h1>CareConnect – Elder Help Platform</h1>
    <nav>
      <a href="/volunteer-dashboard">Home</a> 
      <a href="/volunteer">Become a Volunteer</a>
      <a href="/login">Volunteer Login</a>
    </nav>
  </header>

  <!-- ✅ SUCCESS ALERT -->
  <div id="success-alert" class="alert alert-success alert-dismissible fade show text-center mx-auto" role="alert" style="max-width: 600px; display: none;">
    <strong>✅ Login successful!</strong>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <!-- ❌ ERROR ALERT -->
  <div id="error-alert" class="alert alert-danger alert-dismissible fade show text-center mx-auto" role="alert" style="max-width: 600px; display: none;">
    <strong>❌ Login failed! Please check your email or password.</strong>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <main class="d-flex justify-content-center align-items-center mt-5">
    <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">
      <h3 class="text-center mb-4">Volunteer Login</h3>
      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" id="email" class="form-control" placeholder="Enter Email" required />
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter Password" required />
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary px-4">Login</button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 CareConnect</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ✅ Login Script -->
  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("http://localhost:5000/api/volunteers/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.volunteerId) {
          localStorage.setItem("volunteerId", data.volunteerId);
          window.location.href = "/login?login=success";
        } else {
          window.location.href = "/login?login=fail";
        }
      } catch (err) {
        console.error("Login error:", err);
        window.location.href = "/login?login=fail";
      }
    });

    // ✅ Handle query-based alerts
    const loginStatus = new URLSearchParams(window.location.search).get("login");

    if (loginStatus === "fail") {
      const alertBox = document.getElementById("error-alert");
      alertBox.style.display = "block";
      window.history.replaceState({}, document.title, window.location.pathname);

      setTimeout(() => {
        const alert = bootstrap.Alert.getOrCreateInstance(alertBox);
        alert.close();
      }, 8000);
    }

    if (loginStatus === "success") {
      const alertBox = document.getElementById("success-alert");
      alertBox.style.display = "block";

      // Clean URL
      window.history.replaceState({}, document.title, window.location.pathname);

      // Redirect after short delay
      setTimeout(() => {
        window.location.href = "/dashboard";
      }, 1500);
    }
  </script>

</body>
</html>
