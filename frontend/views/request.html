<!-- Elder request -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Request Help – CareConnect</title>
  <link rel="stylesheet" href="/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

  <header>
    <h1>CareConnect – Elder Help Platform</h1>
    <nav>
      <a href="/elder-dashboard">Home</a>
      <a href="/request">Request Help</a>
      <a href="/viewRequest">View Requests</a>
    </nav>
  </header>

  <main>
    <div id="success-alert" class="alert alert-success alert-dismissible fade show text-center mx-auto" role="alert" style="max-width: 600px; display: none;">
      <strong>✅ Request submitted successfully!</strong>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form action="/api/requests/submit-request" method="POST" class="mx-auto mt-4" style="max-width: 600px;">
  <input type="hidden" name="elderId" id="elderIdInput" />

  <label for="name">Full Name:</label>
  <input type="text" name="name" class="form-control mb-3" required>

  <label for="age">Age:</label>
  <input type="number" name="age" class="form-control mb-3" required>

  <label for="location">Location:</label>
  <input type="text" name="location" class="form-control mb-3" required>

  <label for="helpType">Type of Help Needed:</label>
  <select name="helpType" class="form-select mb-3" required>
    <option value="" disabled selected hidden>Select help type</option>
    <option value="Groceries">Groceries</option>
    <option value="Medicine">Medicine</option>
    <option value="Doctor Visit">Doctor Visit</option>
    <option value="Other">Other</option>
  </select>

  <label for="contact">Contact Info:</label>
  <input type="text" name="contact" class="form-control mb-4" required>

  <div class="text-center">
    <button type="submit" class="btn btn-success px-4">Submit Request</button>
  </div>
</form>

  </main>

  <footer>
    <p>&copy; 2025 CareConnect</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const submitted = urlParams.get("submitted");

    if (submitted) {
      const alertBox = document.getElementById("success-alert");
      alertBox.style.display = "block";

      // Remove the query string from the URL without reloading
      window.history.replaceState({}, document.title, window.location.pathname);

      // Auto-hide after 10 seconds
      setTimeout(() => {
        const alert = bootstrap.Alert.getOrCreateInstance(alertBox);
        alert.close();
      }, 10000);
    }

    // 🔐 Elder login check
   const elderId = localStorage.getItem("elderId");
  if (!elderId) {
    alert("Please login to request help.");
    window.location.href = "/elder-login";
  } else {
    // set hidden field value
    document.getElementById("elderIdInput").value = elderId;
  }
  </script>

</body>
</html>
