<!-- Elder View Requests -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard – CareConnect</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    table {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
    }

    th, td {
      padding: 12px 15px;
      text-align: center;
      border: 1px solid #ccc;
    }

    th {
      background-color: #2f4f4f;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    h1 {
      text-align: center;
      margin-top: 30px;
    }

    nav {
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>CareConnect – Elder Help Platform</h1>
    <h3>Dashboard – Help Requests</h3>
    <nav>
      <a href="/elder-dashboard">Home</a>
      <a href="/request">Request Help</a> 
      <a href="/viewRequest">View Requests</a>
    </nav>
  </header>

  <main>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Location</th>
          <th>Help Type</th>
          <th>Contact</th>
          <th>Status</th> <!-- ✅ New Column -->
        </tr>
      </thead>
      <tbody id="request-list">
        <!-- Dynamic rows will be inserted here -->
      </tbody>
    </table>
  </main>

  <footer>
    <p>&copy; 2025 CareConnect</p>
  </footer>

  <script>
    // 🔐 Elder login check
    const elderId = localStorage.getItem("elderId");
    if (!elderId) {
      alert("Please login to view your requests.");
      window.location.href = "/elder-login";
    } else {
      // ✅ Fetch only this elder's requests
      fetch(`/api/requests/elder/${elderId}`)
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById("request-list");
          tbody.innerHTML = ""; // Clear previous data
          data.forEach(req => {
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${req.name}</td>
              <td>${req.age}</td>
              <td>${req.location || "-"}</td>
              <td>${req.helpType || req.typeOfHelp || "-"}</td>
              <td>${req.contact || req.phone || "-"}</td>
              <td>${req.status || "Pending"}</td>
            `;
            tbody.appendChild(row);
          });
        })
        .catch(err => {
          console.error("Error fetching requests:", err);
          alert("Failed to load your help requests.");
        });
    }
  </script>
</body>
</html>
