<!-- Volunteer Registration -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Become a Volunteer – CareConnect</title>
  <link rel="stylesheet" href="/style.css" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>

  <header>
    <h1>CareConnect – Elder Help Platform</h1>
    <nav>
      <a href="/volunteer-dashboard">Home</a> 
      <a href="/volunteer">Become a Volunteer</a>
      <a href="/login">Volunteer Login</a>
    </nav>
  </header>

  <main>
    <div id="success-alert" class="alert alert-success alert-dismissible fade show text-center mx-auto" role="alert" style="max-width: 600px; display: none;">
      <strong>✅ Volunteer registered successfully!</strong>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form action="/api/volunteers/submit-volunteer" method="POST" class="mx-auto mt-4" style="max-width: 600px;">
      <label for="name">Full Name:</label>
      <input type="text" name="name" class="form-control mb-3" required>

      <label for="location">Location:</label>
      <input type="text" name="location" class="form-control mb-3" required>

      <label for="helpType">Type of Help You Can Offer:</label>
      <select name="helpType" class="form-select mb-3" required>
        <option value="" disabled selected hidden>Select help type</option>
        <option value="Groceries">Groceries</option>
        <option value="Medicine">Medicine</option>
        <option value="Doctor Visit">Doctor Visit</option>
        <option value="Other">Other</option>
      </select>

      <label for="contact">Contact Number:</label>
      <input type="text" name="contact" class="form-control mb-3" required>

      <label for="email">Email:</label>
      <input type="email" name="email" class="form-control mb-3" required>

      <label for="password">Password:</label>
      <input type="password" name="password" class="form-control mb-4" required>

      <div class="text-center">
        <button type="submit" class="btn btn-primary px-4">Register</button>
      </div>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 CareConnect</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const submitted = urlParams.get("submitted");

    if (submitted) {
      const alertBox = document.getElementById("success-alert");
      alertBox.style.display = "block";
      window.history.replaceState({}, document.title, window.location.pathname);
      setTimeout(() => {
        const alert = bootstrap.Alert.getOrCreateInstance(alertBox);
        alert.close();
      }, 10000);
    }
  </script>

</body>
</html>
